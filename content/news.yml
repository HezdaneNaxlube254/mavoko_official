articles:
  - title: Agriculture Grade 10 Project Kick‑Off – ‘Feed the Future’”
    date: 2026-07-22T09:40:00.000+03:00
    image: /images/uploads/whatsapp-image-2026-07-28-at-9.03.04-pm-3-.jpeg
    category: Academic
    summary: Grade 10 learners launched their hands‑on agriculture project, aiming
      to grow vegetables using modern farming techniques.
    body: >-
      The Grade 10 Agriculture class officially kicked off their term‑long
      project,“Feed the Future,”on Friday 20th February 2026.

      Learners gathered at the school farm to prepare seed beds, set up drip irrigation, and plant kale, spinach, and tomatoes. The project combines theory from the classroom with hands‑on practice, covering:- Soil testing & preparation,Water‑efficient irrigation methods,Organic pest control,Record‑keeping and farm economics  

      Agriculture teacher  noted, “This project gives our students real‑world skills they can use at home and in future careers.”

      The harvest will be used in the school kitchen and any surplus will be sold to the local community, teaching basic entrepreneurship.


      Watch this space for updates on germination and crop progress!
